# Dev toolchain only. The plugins themselves are stdlib-only and are run by
# SwiftBar through a PEP 723 shebang, so nothing here is needed at runtime.
[project]
name = "swiftbar-plugins"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib", "plugins", "."]

[tool.ruff]
line-length = 88
src = ["lib", "plugins", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixture tables and asserted output strings are data; wrapping them hurts.
"tests/*" = ["E501"]
